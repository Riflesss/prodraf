services:
  mongodb:
    image: mongo:7
    container_name: borrowing_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: borrowing_db
    volumes:
      - mongodb_data:/data/db

  backend:
    build: ./backend
    container_name: borrowing_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/borrowing_db?authSource=admin
      JWT_SECRET: your_super_secret_jwt_key_change_this
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules

volumes:
  mongodb_data: